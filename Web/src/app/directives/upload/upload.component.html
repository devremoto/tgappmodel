<table style="width:100%">
    <tr>
        <td valign="top" width="33%">
            <span class="btn btn-primary btn-file" (click)="click()"
                style="cursor:pointer">

                <span>
                    @if(cssIcon){<i [class]="cssIcon">&nbsp;</i>&nbsp;{{label}}}
                </span>

                <input type="hidden" [ngModel]=model
                    (ngModelChange)="updateData()" />
                <!-- <input #input type="file" (change)="updateData()" style="cursor:pointer" ng2FileSelect
                    [uploader]="uploader" class="form-control" [id]="id" [name]="name" /> -->
            </span>
        </td>
        @if(file.name && !file.isDoc){
        <td width="33%">
            @if(file.isVideo){
            <video #video width="{{width}}" height="{{height}}" controls
                id="video{{file.name}}">
                <source [src]="src" [type]="item.file.type"> Your browser does
                not support the video tag.
            </video>
            }
            @if(file.isImage){
            <img #image [src]="src"
                alt="{{file.fileName}}" />
            }
        </td>
        }
        @if(file.name && !file.isDoc){
        <td width="33%">
            {{file.fileName}}
            <br /> {{file.formattedSize}}
        </td>
        }
        @if(file.name && file.isDoc){
        <td width="64%">
            <a class [href]="src" #doc>
                <i class="fa fa-file-archive-o"></i> {{file.fileName}}
            </a> - {{file.formattedSize}}
        </td>
        }
    </tr>
</table>
